[package]
name = "hydro-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hydro_runtime"
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"
regex = "1"
num-bigint.workspace = true
num-traits.workspace = true
hydro-ir.workspace = true
# Runtime `compile`/`exec`/`eval` parse dynamic source with the workspace
# CPython-3.14 parser fork. `hydro-frontend` cannot be used here: its typed
# lowering rejects the unbound-name programs `exec` must accept, and
# `hydro-interp` already depends on this crate (cycle).
rustpython-parser = { package = "hydro-python-parser", path = "../hydro-python-parser" }
# HNA v1 descriptor layout and constants (contract only; no code at runtime).
hydro-hna = { path = "../hydro-hna" }
# Pure-Rust TLS for the native `ssl` module. `ring` avoids a system OpenSSL
# dependency; `webpki-roots` supplies the Mozilla trust store.
rustls = { version = "=0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.13.1", features = ["std"] }
webpki-roots = "=1.0.5"

[build-dependencies]
cc = "1"
