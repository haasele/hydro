[package]
name = "hydro-fuzz-stable"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hydro-fuzz-stable"
path = "src/main.rs"

[dependencies]
hydro-frontend = { path = "../../crates/hydro-frontend" }
hydro-codegen = { path = "../../crates/hydro-codegen" }
hydro-runtime = { path = "../../crates/hydro-runtime" }

# Standalone workspace: the stable fallback is built with the ordinary stable
# toolchain and must not pull `libfuzzer-sys` (which needs `cargo-fuzz` and
# nightly sanitizer flags).
[workspace]
