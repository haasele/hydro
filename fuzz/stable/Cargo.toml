[package]
name = "pyx-fuzz-stable"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pyx-fuzz-stable"
path = "src/main.rs"

[dependencies]
pyx-frontend = { path = "../../crates/pyx-frontend" }
pyx-codegen = { path = "../../crates/pyx-codegen" }
pyx-runtime = { path = "../../crates/pyx-runtime" }

# Standalone workspace: the stable fallback is built with the ordinary stable
# toolchain and must not pull `libfuzzer-sys` (which needs `cargo-fuzz` and
# nightly sanitizer flags).
[workspace]
