name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: fmt, clippy, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: CPython gate manifest
        run: python3 scripts/cpython_compat.py --check-manifest

      - name: Harness self-tests
        run: python3 scripts/test_check_benchmarks.py

      # Timing on shared runners is too noisy for enforcement (Q-06). The
      # checked-in baseline is only validated and reported non-blockingly;
      # the real gate is `scripts/check_benchmarks.py` on a local/release host.
      - name: Benchmark threshold report (non-blocking)
        continue-on-error: true
        run: python3 scripts/check_benchmarks.py --check -v

      - name: Full gate (E2E, AOT, GC)
        run: ./scripts/verify.sh

  # Bounded fuzz smoke (P2-20f): every target runs for a small fixed budget and
  # a crash fails the job. The 24 h campaign is a manual/local run; see the
  # header of scripts/fuzz-smoke.sh and fuzz/Cargo.toml.
  fuzz-smoke:
    name: bounded fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and fuzz target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/stable/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-
            ${{ runner.os }}-cargo-

      # No cargo-fuzz/nightly on the runner: the script falls back to the
      # stable harness in fuzz/stable (same harness code, deterministic
      # bounded inputs).
      - name: Bounded fuzz smoke
        timeout-minutes: 15
        env:
          FUZZ_ITERATIONS: 200
        run: ./scripts/fuzz-smoke.sh
