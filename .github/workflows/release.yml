name: Release

# Tag-driven Hydro runtime artifacts. Tea releases its CLI/AOT binaries in the
# separate Tea repository; this workflow only packages the runtime staticlib.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime:
    name: build, test and package runtime (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-hydro-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build runtime
        run: cargo build --release --locked -p hydro-runtime

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-dev}"
          name="hydro-${tag}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          install -m 0644 target/release/libhydro_runtime.a "dist/$name/libhydro_runtime.a"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          mkdir -p "dist/$name/docs"
          cp docs/ARCHITECTURE.md docs/C_API.md docs/COMPATIBILITY.md docs/LAYOUT.md "dist/$name/docs/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydro-runtime-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
