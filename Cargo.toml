[workspace]
resolver = "2"
members = [
    "crates/hydro-ir",
    "crates/hydro-frontend",
    "crates/hydro-runtime",
    "crates/hydro-interp",
    "crates/hydro-codegen",
    "crates/hydro-python-parser",
    "crates/hydro-hna",
    "crates/hydro-hna-fixture",
    "crates/hydro-bindgen",
    "crates/hydro-sqlite-hna",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
hydro-ir = { path = "crates/hydro-ir" }
hydro-frontend = { path = "crates/hydro-frontend" }
hydro-runtime = { path = "crates/hydro-runtime" }
hydro-interp = { path = "crates/hydro-interp" }
hydro-codegen = { path = "crates/hydro-codegen" }
hydro-python-parser = { path = "crates/hydro-python-parser" }
rustpython-parser = "0.4"
cranelift-codegen = "0.120"
cranelift-frontend = "0.120"
cranelift-module = "0.120"
cranelift-jit = "0.120"
cranelift-object = "0.120"
cranelift-native = "0.120"
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
