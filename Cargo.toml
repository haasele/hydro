[workspace]
resolver = "2"
members = [
    "crates/pyx-ir",
    "crates/pyx-frontend",
    "crates/pyx-runtime",
    "crates/pyx-codegen",
    "crates/pyx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pyx-ir = { path = "crates/pyx-ir" }
pyx-frontend = { path = "crates/pyx-frontend" }
pyx-runtime = { path = "crates/pyx-runtime" }
pyx-codegen = { path = "crates/pyx-codegen" }
rustpython-parser = "0.4"
cranelift-codegen = "0.120"
cranelift-frontend = "0.120"
cranelift-module = "0.120"
cranelift-jit = "0.120"
cranelift-object = "0.120"
cranelift-native = "0.120"
target-lexicon = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
